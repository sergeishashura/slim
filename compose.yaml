services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8080:8080"
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance}
      MYSQL_USER: ${MYSQL_USER:-finance_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-app-password}
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
