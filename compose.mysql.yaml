services:
  app:
    environment:
      DB_DRIVER: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance}
      MYSQL_USER: ${MYSQL_USER:-finance_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-app-password}
    depends_on:
      db:
        condition: service_healthy

  db:
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute='SELECT 1'
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
